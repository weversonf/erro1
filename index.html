<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAP Pro v11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #000000;
            --card-dark: #0d0d0e;
            --accent-pink: #f43f5e;
            --accent-rose: #e11d48;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ecrã de Login */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .auth-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.2rem;
            padding: 1.2rem 1.5rem;
            color: white;
            font-weight: 700;
            outline: none;
            width: 300px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .auth-input:focus {
            border-color: var(--accent-pink);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.15);
        }

        .glass-card { 
            background: #0d0d0e; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 1.5rem;
        }

        /* Cores de Status */
        .status-conheci { border-left: 4px solid #3b82f6; }
        .status-sai { border-left: 4px solid #a855f7; }
        .status-fiquei { border-left: 4px solid #ec4899; }
        .status-transei { border-left: 4px solid #ef4444; }

        /* Navegação */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 92%;
            max-width: 400px;
        }

        .bottom-nav-container {
            background: rgba(13, 13, 14, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            padding: 8px;
            display: flex; 
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .nav-btn {
            color: #52525b;
            width: 48px; height: 48px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 999px;
            display: flex; align-items: center; justify-content: center;
        }

        .nav-btn.nav-active {
            color: #ffffff;
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: tabFadeIn 0.4s ease-out; }

        @keyframes tabFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Modal Dossiê */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 110;
        }

        .badge-circle {
            width: 65px;
            height: 65px;
            border-radius: 24px;
            background: #161617;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0.3;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .badge-circle.active {
            opacity: 1;
            border-color: rgba(244, 63, 94, 0.5);
            background: rgba(244, 63, 94, 0.08);
            transform: scale(1.05);
        }
        .badge-circle i { width: 20px; height: 20px; }
        .badge-circle span { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }

        .pro-label {
            background: linear-gradient(90deg, #f43f5e, #e11d48);
            color: white;
            font-size: 9px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        
        #login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Drawer Menu */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 95;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .drawer-menu {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 90%;
            max-width: 420px;
            background: #000000;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 96;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .drawer-menu.active {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* Calendar Styles */
        .calendar-day {
            aspect-ratio: 1;
            border-radius: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .calendar-day:hover {
            border-color: rgba(244, 63, 94, 0.3);
            background: rgba(244, 63, 94, 0.05);
        }

        .calendar-day.other-month {
            opacity: 0.2;
        }

        .calendar-day.today {
            border-color: var(--accent-pink);
            background: rgba(244, 63, 94, 0.1);
        }

        .calendar-day.has-event {
            border-color: var(--accent-pink);
            background: rgba(244, 63, 94, 0.15);
        }

        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--accent-pink);
        }

        .event-item {
            background: rgba(244, 63, 94, 0.1);
            border-left: 3px solid var(--accent-pink);
            border-radius: 0.75rem;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
        }

        .event-time {
            font-weight: 700;
            color: var(--accent-pink);
            font-size: 0.7rem;
        }

        .event-title {
            font-weight: 600;
            margin-top: 0.25rem;
            font-size: 0.85rem;
        }

        .event-lead {
            font-size: 0.7rem;
            color: #a1a1a1;
            margin-top: 0.25rem;
        }

        .header-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .header-icon-btn:hover {
            background: rgba(244, 63, 94, 0.1);
            border-color: rgba(244, 63, 94, 0.3);
            color: var(--accent-pink);
        }
    </style>
</head>
<body class="no-scrollbar">

    <!-- Ecrã de Login -->
    <div id="auth-screen">
        <div class="text-center space-y-10">
            <div class="space-y-3">
                <span class="text-5xl font-black tracking-tighter italic">MAP<span class="text-rose-500">.</span></span>
                <p class="text-[11px] font-bold text-zinc-500 uppercase tracking-[0.4em] italic">Dossiê Ranking System</p>
            </div>
            <div class="space-y-4 flex flex-col">
                <input type="text" id="login-user" placeholder="UTILIZADOR" class="auth-input italic uppercase">
                <input type="password" id="login-pass" placeholder="PALAVRA-PASSE" class="auth-input italic uppercase">
                <button onclick="handleLogin()" id="login-btn" class="bg-white text-black py-5 rounded-[1.2rem] font-black text-[12px] uppercase tracking-widest active:scale-95 transition-all shadow-xl shadow-white/5">
                    Entrar no Sistema
                </button>
                <p id="error-msg" class="text-rose-500 text-[10px] font-black uppercase mt-2 hidden">Falha na Autenticação</p>
            </div>
        </div>
    </div>

    <!-- Aplicação Principal -->
    <div id="real-app" class="min-h-screen pb-40 hidden">
        <header class="p-8 flex justify-between items-center max-w-lg mx-auto">
            <div class="flex items-center gap-4">
                <span class="text-3xl font-black tracking-tighter italic">MAP<span class="text-rose-500">.</span></span>
                <div class="bg-zinc-900/80 px-4 py-2 rounded-2xl flex items-center gap-2 border border-white/5">
                    <div id="cloud-status" class="w-2 h-2 rounded-full bg-zinc-700"></div>
                    <span class="text-[13px] font-black text-yellow-500 italic" id="global-score">0.00</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleDrawer()" class="header-icon-btn" title="Abrir Agenda">
                    <i data-lucide="calendar" class="w-5 h-5"></i>
                </button>
                <button onclick="switchTab('profile')" class="w-12 h-12 rounded-2xl overflow-hidden border-2 border-white/10 shadow-2xl active:scale-90 transition-transform">
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar" class="w-full h-full object-cover">
                </button>
            </div>
        </header>

        <main class="max-w-lg mx-auto px-6 space-y-8">
            <!-- TAB: HOME -->
            <div id="tab-home" class="tab-content active">
                <div class="space-y-6">
                    <div class="flex items-center gap-3 bg-zinc-900/40 p-4 rounded-2xl border border-white/5">
                        <i data-lucide="search" class="w-5 h-5 text-zinc-600"></i>
                        <input type="text" id="search-input" placeholder="Procurar..." oninput="renderSearch()" class="bg-transparent outline-none flex-1 text-[13px] font-bold italic uppercase placeholder-zinc-700 text-white">
                    </div>
                    <div id="search-results" class="space-y-3"></div>
                </div>
            </div>

            <!-- TAB: RECENTES -->
            <div id="tab-recent" class="tab-content space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-black italic tracking-tighter">Recentes</h2>
                    <button onclick="createNewMatch()" class="bg-rose-500 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">+ Novo</button>
                </div>
                <div id="recent-list" class="space-y-3"></div>
            </div>

            <!-- TAB: STATS -->
            <div id="tab-stats" class="tab-content">
                <h2 class="text-xl font-black italic tracking-tighter mb-6">Estatísticas</h2>
                <div id="alphabet-grid" class="grid grid-cols-6 gap-2"></div>
            </div>

            <!-- TAB: PROFILE -->
            <div id="tab-profile" class="tab-content space-y-6">
                <div class="text-center">
                    <h2 class="text-2xl font-black italic tracking-tighter mb-2">Olá, <span id="display-name">UTILIZADOR</span></h2>
                    <p class="text-[11px] font-black text-zinc-600 uppercase tracking-widest italic" id="display-role">ACESSO COMUM</p>
                </div>
                
                <div id="master-area" class="hidden space-y-4">
                    <div class="bg-zinc-900/50 p-6 rounded-2xl border border-white/5">
                        <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest italic mb-3">Área Master</p>
                        <textarea id="wa-text-input" placeholder="Cole aqui dados do WhatsApp..." class="w-full h-32 bg-transparent text-[12px] text-zinc-400 italic outline-none resize-none leading-relaxed border border-white/10 rounded-xl p-3"></textarea>
                        <button onclick="processAIImport()" class="w-full mt-3 bg-rose-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Importar</button>
                    </div>
                </div>

                <button onclick="handleLogout()" class="w-full bg-zinc-900/50 text-white py-4 rounded-2xl font-black text-[11px] uppercase border border-white/5 hover:bg-zinc-900 transition-all">Sair do Sistema</button>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <div class="bottom-nav-wrapper">
            <div class="bottom-nav-container">
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn nav-active" title="Home">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </button>
                <button onclick="switchTab('recent')" id="nav-recent" class="nav-btn" title="Recentes">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </button>
                <button onclick="switchTab('stats')" id="nav-stats" class="nav-btn" title="Estatísticas">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                </button>
                <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn" title="Perfil">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Drawer Menu -->
        <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
        <div id="drawer-menu" class="drawer-menu">
            <div class="drawer-header">
                <h3 class="text-lg font-black italic tracking-tighter">Agenda</h3>
                <button onclick="closeDrawer()" class="p-2 hover:bg-zinc-900 rounded-lg transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="drawer-content space-y-6">
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <button onclick="previousMonth()" class="p-2 hover:bg-zinc-900 rounded-lg transition-all">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <h4 id="calendar-month" class="text-[12px] font-black uppercase tracking-widest italic"></h4>
                        <button onclick="nextMonth()" class="p-2 hover:bg-zinc-900 rounded-lg transition-all">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
                </div>

                <div class="border-t border-white/5 pt-4">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-[11px] font-black uppercase tracking-widest italic">Encontros</h4>
                        <button onclick="openScheduleModal()" class="bg-rose-500 text-white px-3 py-1 rounded-lg text-[9px] font-black uppercase">+ Agendar</button>
                    </div>
                    <div id="drawer-events" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Dossiê -->
    <div id="match-modal" class="fixed inset-0 modal-overlay hidden flex items-center justify-center p-4 z-[110] overflow-y-auto">
        <div class="glass-card w-full max-w-lg p-8 space-y-6 relative border-t border-white/10 shadow-2xl rounded-3xl my-8">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-black italic tracking-tighter">Dossiê</h3>
                <div class="flex gap-2">
                    <button onclick="deleteMatch()" class="p-3 bg-red-900/20 rounded-2xl text-red-500 hover:bg-red-900/30 transition-all" title="Apagar">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                    <button onclick="closeModal()" class="p-3 bg-zinc-900 rounded-2xl text-zinc-500">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="space-y-6">
                <div class="flex flex-col items-center gap-4">
                    <div class="relative">
                        <div id="modal-photo-img" class="w-24 h-24 rounded-3xl bg-zinc-900 border-2 border-white/10 object-cover hidden"></div>
                        <div id="modal-initial" class="w-24 h-24 rounded-3xl bg-gradient-to-br from-rose-500 to-rose-600 flex items-center justify-center text-4xl font-black text-white"></div>
                    </div>
                    <label class="cursor-pointer p-3 bg-zinc-900/80 rounded-2xl border border-white/10 hover:border-rose-500/30 transition-all">
                        <i data-lucide="camera" class="w-4 h-4 text-white"></i>
                        <input type="file" class="hidden" id="match-photo-input" accept="image/*">
                    </label>
                </div>
                <div class="text-center w-full">
                    <input type="text" id="edit-name" class="text-center text-3xl font-black italic tracking-tighter bg-transparent outline-none w-full text-white uppercase placeholder-zinc-800" placeholder="NOME DO MATCH">
                    <div class="flex justify-center items-center gap-3 mt-3">
                        <span class="text-[11px] font-black text-zinc-600 uppercase tracking-widest italic">Idade Atual:</span>
                        <input type="number" id="edit-age" class="w-14 bg-transparent font-black italic text-xl text-rose-500 outline-none">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-5 bg-zinc-900/40">
                        <p class="text-[10px] font-black text-zinc-600 uppercase mb-2 tracking-widest italic">Profissão</p>
                        <input type="text" id="edit-profession" class="w-full bg-transparent outline-none italic font-bold text-[13px] text-white" placeholder="...">
                    </div>
                    <div class="glass-card p-5 bg-zinc-900/40">
                        <p class="text-[10px] font-black text-zinc-600 uppercase mb-2 tracking-widest italic">Estudos</p>
                        <input type="text" id="edit-formation" class="w-full bg-transparent outline-none italic font-bold text-[13px] text-white" placeholder="...">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-5 bg-zinc-900/40">
                        <p class="text-[10px] font-black text-zinc-600 uppercase mb-2 tracking-widest italic">Bairro</p>
                        <input type="text" id="edit-neighborhood" class="w-full bg-transparent outline-none italic font-bold text-[13px] text-white" placeholder="...">
                    </div>
                    <div class="glass-card p-5 bg-zinc-900/40">
                        <p class="text-[10px] font-black text-zinc-600 uppercase mb-2 tracking-widest italic">Cidade/UF</p>
                        <input type="text" id="edit-city" class="w-full bg-transparent outline-none italic font-bold text-[13px] text-white" placeholder="...">
                    </div>
                </div>
                <div class="glass-card p-5 bg-zinc-900/40">
                    <p class="text-[10px] font-black text-rose-500/60 uppercase mb-2 tracking-widest italic">Instagram</p>
                    <div class="flex items-center gap-1">
                        <span class="text-zinc-500 text-sm font-bold">@</span>
                        <input type="text" id="edit-instagram" class="w-full bg-transparent outline-none italic font-bold text-[13px] text-white" placeholder="user_insta">
                    </div>
                </div>
            </div>

            <!-- Badges -->
            <div class="flex justify-center gap-4">
                <div onclick="toggleBadge('bebe')" id="badge-bebe" class="badge-circle"><i data-lucide="wine"></i><span class="italic">Bebe</span></div>
                <div onclick="toggleBadge('fuma')" id="badge-fuma" class="badge-circle"><i data-lucide="cigar"></i><span class="italic">Fuma</span></div>
                <div onclick="askKidsCount()" id="badge-filhos" class="badge-circle"><i data-lucide="baby"></i><span id="label-filhos" class="italic">Kids</span></div>
                <div onclick="toggleBadge('pets')" id="badge-pets" class="badge-circle"><i data-lucide="dog"></i><span class="italic">Pets</span></div>
            </div>

            <div class="bg-zinc-900/50 p-6 rounded-[2rem] border border-white/5 space-y-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="brain-circuit" class="w-4 h-4 text-zinc-600"></i>
                    <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest italic">Memória Estratégica</p>
                </div>
                <textarea id="edit-topics" class="w-full h-32 bg-transparent text-[12px] text-zinc-400 italic outline-none resize-none leading-relaxed" placeholder="Anotações para não falhar na próxima conversa..."></textarea>
            </div>

            <button onclick="saveAndClose()" class="w-full bg-white text-black text-[12px] font-black uppercase py-5 rounded-[1.8rem] active:scale-95 italic transition-all shadow-2xl shadow-white/5">Salvar Dossiê</button>
        </div>
    </div>

    <!-- Modal Agendar Encontro -->
    <div id="schedule-modal" class="fixed inset-0 modal-overlay hidden flex items-center justify-center p-4 z-[110]">
        <div class="glass-card w-full max-w-lg p-8 space-y-6 relative border-t border-white/10 shadow-2xl rounded-3xl">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-black italic tracking-tighter">Agendar Encontro</h3>
                <button onclick="closeScheduleModal()" class="p-3 bg-zinc-900 rounded-2xl text-zinc-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest italic block mb-2">Seleciona um Lead</label>
                    <select id="schedule-lead" class="w-full bg-zinc-900/80 border border-white/10 rounded-2xl px-5 py-4 text-sm font-bold outline-none uppercase italic text-white">
                        <option value="">-- Escolher Lead --</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest italic block mb-2">Data</label>
                    <input type="date" id="schedule-date" class="w-full bg-zinc-900/80 border border-white/10 rounded-2xl px-5 py-4 text-sm font-bold outline-none text-white">
                </div>

                <div>
                    <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest italic block mb-2">Hora</label>
                    <input type="time" id="schedule-time" class="w-full bg-zinc-900/80 border border-white/10 rounded-2xl px-5 py-4 text-sm font-bold outline-none text-white">
                </div>

                <div>
                    <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest italic block mb-2">Local/Notas</label>
                    <textarea id="schedule-notes" placeholder="Ex: Café da Avenida, Parque Central..." class="w-full h-24 bg-zinc-900/80 border border-white/10 rounded-2xl px-5 py-4 text-sm font-bold outline-none text-white resize-none italic"></textarea>
                </div>
            </div>

            <button onclick="saveSchedule()" class="w-full bg-rose-500 text-white py-5 rounded-2xl font-black text-[11px] uppercase tracking-widest italic shadow-lg shadow-rose-500/10 hover:bg-rose-600 transition-all">Agendar Encontro</button>
        </div>
    </div>

    <script>
        // ==========================================
        // COLE AQUI A URL DO SEU GOOGLE APPS SCRIPT
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCOuuMGlaTJIl4he-H0gALsRNn40IjM4pmWfNR8vcmCTGf3LYfo40Pt-4dLMz0m4YZ/exec"; 

        let currentUser = null;
        let userData = { role: 'Comum' };
        window.matches = [];
        window.schedules = [];
        let activeTab = 'home';
        let currentEditingId = null;
        let currentCalendarDate = new Date();
        let selectedCalendarDate = new Date();

        // --- DRAWER ---
        function toggleDrawer() {
            document.getElementById('drawer-overlay').classList.toggle('active');
            document.getElementById('drawer-menu').classList.toggle('active');
            if (document.getElementById('drawer-menu').classList.contains('active')) {
                renderCalendar();
                updateDrawerEvents();
            }
        }

        function closeDrawer() {
            document.getElementById('drawer-overlay').classList.remove('active');
            document.getElementById('drawer-menu').classList.remove('active');
        }

        // --- AUTH ---
        async function handleLogin() {
            const user = document.getElementById('login-user').value.toLowerCase().trim();
            const pass = document.getElementById('login-pass').value.trim();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error-msg');

            if(!user || !pass) {
                err.textContent = "Preencha utilizador e palavra-passe";
                err.classList.remove('hidden');
                return;
            }
            
            btn.textContent = "AUTENTICANDO...";
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                const response = await fetch(`${SCRIPT_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
                
                // Verificar se a resposta é válida
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                // Tentar fazer parse do JSON
                let result;
                try {
                    result = await response.json();
                } catch (parseError) {
                    console.error('Erro ao fazer parse do JSON:', parseError);
                    throw new Error("Resposta inválida do servidor. Verifique a URL do Google Apps Script.");
                }

                // Verificar se o login foi bem-sucedido
                if (result.success) {
                    currentUser = user;
                    userData = result.userData || { role: 'Comum' };
                    initApp();
                } else {
                    throw new Error(result.message || "Login falhou - credenciais inválidas");
                }
            } catch (e) {
                console.error('Erro de login:', e);
                err.textContent = e.message || "Falha na Autenticação";
                err.classList.remove('hidden');
                btn.textContent = "ENTRAR NO SISTEMA";
                btn.disabled = false;
            }
        }

        function initApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('real-app').classList.remove('hidden');
            document.getElementById('display-name').textContent = currentUser.toUpperCase();
            document.getElementById('display-role').textContent = userData.role === 'Master' ? 'ACESSO MASTER' : 'ACESSO COMUM';
            if(userData.role === 'Master') document.getElementById('master-area').classList.remove('hidden');
            loadMatches();
            loadSchedules();
        }

        async function loadMatches() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getMatches&user=${encodeURIComponent(currentUser)}`);
                if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);
                const result = await response.json();
                window.matches = result.data || [];
                render();
            } catch (e) {
                console.error('Erro ao carregar matches:', e);
                window.matches = [];
            }
        }

        async function loadSchedules() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getSchedules&user=${encodeURIComponent(currentUser)}`);
                if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);
                const result = await response.json();
                window.schedules = result.data || [];
                updateDrawerEvents();
            } catch (e) {
                console.error('Erro ao carregar schedules:', e);
                window.schedules = [];
            }
        }

        async function sync() {
            try {
                await fetch(`${SCRIPT_URL}?action=saveMatches&user=${encodeURIComponent(currentUser)}&data=${encodeURIComponent(JSON.stringify(window.matches))}`);
            } catch (e) {
                console.error('Erro ao sincronizar matches:', e);
            }
        }

        async function syncSchedules() {
            try {
                await fetch(`${SCRIPT_URL}?action=saveSchedules&user=${encodeURIComponent(currentUser)}&data=${encodeURIComponent(JSON.stringify(window.schedules))}`);
            } catch (e) {
                console.error('Erro ao sincronizar schedules:', e);
            }
        }

        // --- AGENDA ---
        function renderCalendar() {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            
            document.getElementById('calendar-month').textContent = currentCalendarDate.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' }).toUpperCase();
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const prevLastDay = new Date(year, month, 0).getDate();
            const nextDays = 7 - lastDay.getDay();
            
            let html = '';
            
            // Dias do mês anterior
            for (let i = firstDay.getDay() - 1; i >= 0; i--) {
                const day = prevLastDay - i;
                html += `<div class="calendar-day other-month"><span>${day}</span></div>`;
            }
            
            // Dias do mês atual
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                const dateStr = date.toISOString().split('T')[0];
                const events = window.schedules.filter(s => s.data === dateStr);
                const isToday = date.toDateString() === new Date().toDateString();
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (events.length > 0) classes += ' has-event';
                
                html += `<div class="${classes}" onclick="selectCalendarDay('${dateStr}')">
                    <span>${day}</span>
                </div>`;
            }
            
            // Dias do próximo mês
            for (let day = 1; day <= nextDays; day++) {
                html += `<div class="calendar-day other-month"><span>${day}</span></div>`;
            }
            
            document.getElementById('calendar-grid').innerHTML = html;
        }

        function previousMonth() {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
            renderCalendar();
        }

        function selectCalendarDay(dateStr) {
            selectedCalendarDate = new Date(dateStr);
            updateDrawerEvents();
        }

        function updateDrawerEvents() {
            const dateStr = selectedCalendarDate.toISOString().split('T')[0];
            const events = window.schedules.filter(s => s.data === dateStr);
            const container = document.getElementById('drawer-events');
            
            if (events.length === 0) {
                container.innerHTML = `<p class="text-[11px] text-zinc-600 italic">Nenhum encontro agendado</p>`;
                return;
            }
            
            container.innerHTML = events.map(event => {
                const lead = window.matches.find(m => m.id == event.leadId);
                return `
                    <div class="event-item">
                        <div class="event-time">${event.hora || '--:--'}</div>
                        <div class="event-title">${lead ? lead.nome : 'Lead desconhecido'}</div>
                        ${event.notas ? `<div class="text-[10px] text-zinc-500 mt-1">${event.notas}</div>` : ''}
                        <button onclick="deleteSchedule('${event.id}')" class="text-[9px] text-red-500 mt-2 hover:text-red-400">Remover</button>
                    </div>
                `;
            }).join('');
        }

        function populateLeadSelect() {
            const select = document.getElementById('schedule-lead');
            select.innerHTML = '<option value="">-- Escolher Lead --</option>' + 
                window.matches.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');
        }

        function openScheduleModal() {
            populateLeadSelect();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('schedule-date').value = today;
            document.getElementById('schedule-time').value = '14:00';
            document.getElementById('schedule-lead').value = '';
            document.getElementById('schedule-notes').value = '';
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function closeScheduleModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        function saveSchedule() {
            const leadId = document.getElementById('schedule-lead').value;
            const data = document.getElementById('schedule-date').value;
            const hora = document.getElementById('schedule-time').value;
            const notas = document.getElementById('schedule-notes').value;
            
            if (!leadId || !data) {
                alert('Preenche o Lead e a Data!');
                return;
            }
            
            const lead = window.matches.find(m => m.id == leadId);
            const schedule = {
                id: Date.now().toString(),
                leadId: leadId,
                data: data,
                hora: hora,
                titulo: `Encontro com ${lead.nome}`,
                notas: notas
            };
            
            window.schedules.push(schedule);
            syncSchedules();
            renderCalendar();
            closeScheduleModal();
            selectCalendarDay(data);
        }

        function deleteSchedule(id) {
            if (confirm('Deseja remover este encontro?')) {
                window.schedules = window.schedules.filter(s => s.id !== id);
                syncSchedules();
                renderCalendar();
                updateDrawerEvents();
            }
        }

        // --- TABS ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('nav-active'));
            
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('nav-active');
            activeTab = tab;
        }

        function render() {
            renderRecent();
            renderSearch();
            renderStats();
        }

        function renderRecent() {
            const container = document.getElementById('recent-list');
            container.innerHTML = window.matches.slice(0, 5).map(m => `
                <div class="glass-card p-5 flex items-center justify-between border-l-4 status-${m.status || 'conheci'}" onclick="openModal('${m.id}')">
                    <div class="flex items-center gap-4">
                        <div class="w-11 h-11 rounded-2xl bg-zinc-900 flex items-center justify-center font-black italic border border-white/5 uppercase overflow-hidden">
                            ${m.foto ? `<img src="${m.foto}" class="w-full h-full object-cover">` : ((m.nome || "?")[0])}
                        </div>
                        <div>
                            <h3 class="font-black italic text-[13px] tracking-tighter uppercase">${m.nome || "Novo"}</h3>
                            <p class="text-[8px] text-zinc-600 font-black uppercase tracking-widest italic">${m.data || ""}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                         <select onchange="updateStatus('${m.id}', this.value)" class="text-[9px] bg-zinc-900 rounded-xl px-2 py-2 font-black uppercase text-zinc-500 outline-none italic border border-white/5">
                            <option value="conheci" ${m.status === 'conheci' ? 'selected' : ''}>Conheci</option>
                            <option value="sai" ${m.status === 'sai' ? 'selected' : ''}>Saí</option>
                            <option value="fiquei" ${m.status === 'fiquei' ? 'selected' : ''}>Fiquei</option>
                            <option value="transei" ${m.status === 'transei' ? 'selected' : ''}>Transei</option>
                         </select>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        function renderSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('search-results');
            const filtered = window.matches.filter(m => (m.nome || "").toLowerCase().includes(query));

            container.innerHTML = filtered.map(m => `
                <div class="glass-card p-5 flex items-center justify-between border-l-4 status-${m.status || 'conheci'}" onclick="openModal('${m.id}')">
                    <div class="flex items-center gap-4">
                        <div class="w-11 h-11 rounded-2xl bg-zinc-900 flex items-center justify-center font-black italic border border-white/5 uppercase overflow-hidden">
                            ${m.foto ? `<img src="${m.foto}" class="w-full h-full object-cover">` : ((m.nome || "?")[0])}
                        </div>
                        <div>
                            <h3 class="font-black italic text-[13px] tracking-tighter uppercase">${m.nome || "Novo"}</h3>
                            <p class="text-[8px] text-zinc-600 font-black uppercase tracking-widest italic">${m.data || ""}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                         <select onchange="updateStatus('${m.id}', this.value)" class="text-[9px] bg-zinc-900 rounded-xl px-2 py-2 font-black uppercase text-zinc-500 outline-none italic border border-white/5">
                            <option value="conheci" ${m.status === 'conheci' ? 'selected' : ''}>Conheci</option>
                            <option value="sai" ${m.status === 'sai' ? 'selected' : ''}>Saí</option>
                            <option value="fiquei" ${m.status === 'fiquei' ? 'selected' : ''}>Fiquei</option>
                            <option value="transei" ${m.status === 'transei' ? 'selected' : ''}>Transei</option>
                         </select>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        function renderStats() {
            const counts = {};
            window.matches.forEach(m => { 
                if(m.nome) counts[m.nome[0].toUpperCase()] = (counts[m.nome[0].toUpperCase()] || 0) + 1; 
            });
            document.getElementById('alphabet-grid').innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => `
                <div class="p-4 rounded-3xl border ${counts[l] ? 'bg-zinc-800 border-rose-500/20 text-white' : 'bg-zinc-900/40 border-white/5 text-zinc-800'} flex flex-col items-center">
                    <span class="text-[12px] font-black italic">${l}</span>
                    <span class="text-[9px] font-bold mt-1 opacity-60">${counts[l] || 0}</span>
                </div>`).join('');
        }

        // --- DOSSIÊ LOGIC ---
        function openModal(id) {
            currentEditingId = id;
            const m = window.matches.find(x => x.id == id);
            if(!m) return;

            const setV = (elementId, val) => { const el = document.getElementById(elementId); if(el) el.value = val || ""; };
            setV('edit-name', m.nome); setV('edit-age', m.idade); setV('edit-profession', m.profissao);
            setV('edit-formation', m.formacao); setV('edit-neighborhood', m.bairro); setV('edit-city', m.cidade);
            setV('edit-instagram', m.instagram); setV('edit-topics', m.memoria_estrategica);

            const updBadge = (bid, act, lbl = null) => {
                const el = document.getElementById(`badge-${bid}`);
                if (el) act ? el.classList.add('active') : el.classList.remove('active');
                if (lbl) { const le = document.getElementById(`label-${bid}`); if(le) le.textContent = lbl; }
            };
            updBadge('bebe', m.bebe); updBadge('fuma', m.fuma); updBadge('pets', m.pets);
            updBadge('filhos', m.filhos > 0, m.filhos > 0 ? `Kids (${m.filhos})` : 'Kids');

            const pImg = document.getElementById('modal-photo-img');
            const pIni = document.getElementById('modal-initial');
            if (m.foto) { pImg.src = m.foto; pImg.classList.remove('hidden'); pIni.classList.add('hidden'); }
            else { pImg.classList.add('hidden'); pIni.classList.remove('hidden'); pIni.textContent = (m.nome || "?")[0]; }

            document.getElementById('match-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() { document.getElementById('match-modal').classList.add('hidden'); render(); }
        
        function saveAndClose() {
            const m = window.matches.find(x => x.id == currentEditingId);
            if(m) {
                const getV = (elementId) => document.getElementById(elementId).value;
                m.nome = getV('edit-name'); m.idade = getV('edit-age'); m.profissao = getV('edit-profession');
                m.formacao = getV('edit-formation'); m.bairro = getV('edit-neighborhood'); m.cidade = getV('edit-city');
                m.instagram = getV('edit-instagram'); m.memoria_estrategica = getV('edit-topics');
            }
            sync(); closeModal();
        }

        function toggleBadge(k) {
            const m = window.matches.find(x => x.id == currentEditingId);
            if(m) { m[k] = !m[k]; openModal(currentEditingId); }
        }

        function askKidsCount() {
            const c = prompt("Quantos filhos?", "1");
            if(c !== null) { 
                const m = window.matches.find(x => x.id == currentEditingId);
                if(m) { m.filhos = parseInt(c) || 0; openModal(currentEditingId); }
            }
        }

        function updateStatus(id, s) { 
            window.matches = window.matches.map(m => m.id == id ? { ...m, status: s } : m); sync(); 
        }

        function deleteMatch() {
            if(confirm("Deseja apagar este dossiê permanentemente?")) {
                window.matches = window.matches.filter(x => x.id != currentEditingId); sync(); closeModal();
            }
        }

        function createNewMatch() {
            const id = Date.now();
            window.matches.unshift({ id, nome: "NOVO REGISTO", status: 'conheci', data: new Date().toLocaleDateString('pt-PT') });
            sync(); openModal(id);
        }

        function processAIImport() {
            const raw = document.getElementById('wa-text-input').value;
            if(!raw) return;
            const nameM = raw.match(/(?:\]\s*)([A-Z][a-zà-ú]+)(?:\s*:)/);
            const id = Date.now();
            window.matches.unshift({ id, nome: nameM ? nameM[1].toUpperCase() : "IMPORTADO", status: 'conheci', data: new Date().toLocaleDateString('pt-PT'), memoria_estrategica: raw.substring(0, 300) });
            document.getElementById('wa-text-input').value = "";
            sync(); openModal(id);
        }

        function handleLogout() { window.location.reload(); }

        document.getElementById('match-photo-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                window.matches = window.matches.map(m => m.id == currentEditingId ? { ...m, foto: ev.target.result } : m);
                openModal(currentEditingId);
            };
            reader.readAsDataURL(file);
        });

        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
